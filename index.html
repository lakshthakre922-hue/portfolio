<title>Laksh Thakur – Aspiring Data Analyst</title>

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:400 1.05rem/1.7 var(--serif);min-height:100vh}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--hi));z-index:20}
#glow{position:fixed;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,rgba(124,155,255,.13),transparent 65%);pointer-events:none;z-index:-1;left:-999px;top:-999px}
.wrap{max-width:1000px;margin:0 auto;padding:0 1.25rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(0,0,0,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
nav .wrap{display:flex;gap:.3rem;align-items:center;overflow-x:auto;padding-top:.6rem;padding-bottom:.6rem;font:600 .95rem var(--sans)}
nav a{text-decoration:none;white-space:nowrap;color:var(--mute);padding:.35rem .8rem;border-radius:999px;transition:.2s}
nav a:hover{color:var(--ink)}
nav a.on{background:var(--ink);color:#000}
nav .brand{color:var(--ink);margin-right:auto;font-weight:800}
h1,h2,h3,h4{font-family:var(--sans);line-height:1.1;margin:0}
.page{padding:3.5rem 0 4rem;animation:in .55s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;filter:blur(8px);transform:translateY(18px)}to{opacity:1;filter:none;transform:none}}
.ph{margin-bottom:2.2rem}
.ph h2{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:800;letter-spacing:-.02em}
.ph p{color:var(--mute);max-width:38rem;margin:.6rem 0 0}
h1{font-size:clamp(3rem,13vw,7rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.role{font:600 clamp(1.1rem,3.5vw,1.6rem) var(--sans);color:var(--acc);margin-top:1rem;min-height:2.2rem}
.role i{display:inline-block;width:3px;height:1.1em;background:var(--hi);vertical-align:-.15em;margin-left:3px;animation:bl 1s steps(1) infinite}

.lead{max-width:36rem;font-size:1.25rem;color:var(--mute);margin:1rem 0 2rem}
.btns{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{font:600 1rem var(--sans);padding:.8rem 1.4rem;border-radius:999px;text-decoration:none;border:2px solid var(--ink);transition:.25s;cursor:pointer;background:none;color:var(--ink)}
.btn.p{background:var(--ink);color:#000}
.btn:hover{background:var(--acc);border-color:var(--acc);color:#000;transform:translateY(-3px);box-shadow:0 8px 24px rgba(124,155,255,.35)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin:3.5rem 0 1rem}
.stat{border-top:2px solid var(--line);padding-top:.8rem}
.stat b{font:800 2.6rem var(--sans);display:block;color:var(--hi)}
.stat span{font:600 .9rem var(--sans);color:var(--mute)}
.grid{display:grid;gap:1.2rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{position:relative;background:var(--panel);padding:1.4rem;border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:transform .3s,border-color .3s}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(124,155,255,.16),transparent 70%);opacity:0;transition:.3s;pointer-events:none}
.card:hover{transform:translateY(-6px);border-color:var(--acc)}
.card:hover::after{opacity:1}
.card h3{font-size:1.3rem;margin-bottom:.4rem}
.card p{margin:.4rem 0 0;color:var(--mute)}
.tag{font:600 .85rem var(--sans);color:var(--acc);margin-bottom:.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.9rem}
.chips span{font:500 .88rem var(--sans);padding:.25rem .7rem;border:1px solid var(--line);background:#050508;border-radius:6px;transition:.2s}
.chips span:hover{border-color:var(--hi);color:var(--hi);transform:scale(1.06)}
.more{display:inline-block;margin-top:1rem;font:600 .9rem var(--sans);color:var(--hi);background:none;border:0;padding:0;cursor:pointer}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.tabs button{font:600 .95rem var(--sans);padding:.55rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer;transition:.2s}
.tabs button.on{background:var(--acc);color:#000;border-color:var(--acc)}
.skl{display:grid;gap:.7rem}
.sk{display:flex;gap:1rem;align-items:baseline;padding:.9rem 1.1rem;background:var(--panel);border-left:4px solid var(--hi);animation:in .4s both}
.sk b{font:700 1rem var(--sans);min-width:9rem}
.sk span{color:var(--mute)}
.tl{border-left:2px solid var(--line);margin-left:.5rem}
.job{position:relative;padding:0 0 2.2rem 1.6rem}
.job::before{content:"";position:absolute;left:-8px;top:.4rem;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(124,155,255,.6);animation:pu 2.4s infinite}
@keyframes pu{70%{box-shadow:0 0 0 12px rgba(124,155,255,0)}}
.job h3{font-size:1.35rem}
.job .co{font:600 1rem var(--sans);color:var(--acc);margin:.2rem 0}
.job ul{margin:.6rem 0 0;padding-left:1.1rem;color:var(--mute)}
.road{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.road li{counter-increment:s;font:600 .9rem var(--sans);padding:.45rem .85rem;border:1px solid var(--line);background:var(--panel);border-radius:6px;animation:in .4s both}
.road li::before{content:counter(s) ". ";color:var(--acc)}
.about{display:grid;gap:2rem}

.facts{margin:0;padding:1.3rem;background:var(--panel);border-left:5px solid var(--hi);font-family:var(--sans);font-size:.95rem}
.facts dt{color:var(--mute);font-size:.85rem}
.facts dd{margin:0 0 .8rem;font-weight:600}
.ct a.card{display:block;text-decoration:none}
.ct .big{font:700 1.15rem var(--sans);word-break:break-all;margin-top:.3rem}
.msg{display:grid;gap:.8rem;margin-top:2rem;max-width:34rem}
.msg input,.msg textarea{font:1rem var(--sans);padding:.8rem 1rem;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;width:100%}
.msg textarea{min-height:120px;resize:vertical}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:1rem;z-index:30}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--acc);border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:1.8rem;animation:in .35s}
#modal h3{font-size:1.7rem}
#modal h4{color:var(--acc);margin:1.2rem 0 .3rem;font-size:1rem}
#modal ul{margin:0;padding-left:1.1rem;color:var(--mute)}
footer{padding:2rem 0;color:var(--mute);font:.9rem var(--sans);border-top:1px solid var(--line)}
.socs{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:1.6rem}
.sl{position:relative;display:inline-flex;align-items:center;gap:.7rem;padding:.75rem 1.2rem;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-decoration:none;font:600 1rem var(--sans);overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s}
.sl::before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);transition:left .6s}
.sl:hover::before{left:130%}
.sl svg{transition:transform .35s}
.sl:hover svg{transform:rotate(-12deg) scale(1.25)}
.sl em{font-style:normal;transition:transform .3s;color:var(--mute)}
.sl:hover em{transform:translate(4px,-4px);color:inherit}
.sl:hover{transform:translateY(-5px)}
.sl.li:hover{border-color:#3b8bd9;box-shadow:0 10px 30px rgba(10,102,194,.55);color:#8ec5ff}
.sl.gh:hover{border-color:#fff;box-shadow:0 10px 30px rgba(255,255,255,.22)}
.socs.big .sl{padding:1.1rem 1.7rem;font-size:1.15rem}
.dock{position:fixed;right:max(.8rem,env(safe-area-inset-right,0px));bottom:max(.8rem,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.6rem;z-index:15}
.dock a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);transition:transform .3s,box-shadow .3s,background .3s;animation:fl 3.2s ease-in-out infinite}
.dock a:nth-child(2){animation-delay:.5s}
@keyframes fl{50%{transform:translateY(-5px)}}
.dock a:hover{transform:scale(1.2);background:var(--acc);color:#000;box-shadow:0 0 24px rgba(124,155,255,.7)}
.sec{position:relative;padding:4.5rem 0 3rem;border-top:1px solid var(--line)}
.sec::before{content:"";position:absolute;top:-1px;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--acc),var(--hi));transition:width 1.2s ease}
.sec.vis::before{width:100%}
.rv .ph{transition:opacity .7s,transform .7s}
.rv:not(.vis) .ph{opacity:0;transform:translateX(-36px)}
.rv:not(.vis) .card,.rv:not(.vis) .job{opacity:0}
.rv:not(.vis) .sk,.rv:not(.vis) .road li{opacity:0;animation:none}
.rv.vis .card,.rv.vis .job{animation:up .7s backwards;animation-delay:calc(var(--i,0)*110ms)}
@keyframes up{from{opacity:0;transform:translateY(34px)}}
.hint{margin-top:3rem;font:600 .9rem var(--sans);color:var(--mute)}
.hint::after{content:"\2193";display:block;font-size:1.7rem;color:var(--hi);animation:bo 1.6s infinite}
@keyframes bo{50%{transform:translateY(9px)}}
.certs{list-style:none;margin:.6rem 0 0;padding:0}
.certs li{padding:.55rem 0;border-bottom:1px solid var(--line);font:600 .95rem var(--sans);color:var(--ink)}
.certs li:last-child{border:0}
.certs span{display:block;color:var(--acc);font-size:.82rem;font-weight:500}
.certcard{grid-column:1/-1}
@media(min-width:700px){.certcard .certs{columns:2;column-gap:2.5rem}.certcard .certs li{break-inside:avoid}}
@keyframes gr{from{transform:scaleY(0)}}
@keyframes dr{from{stroke-dasharray:0 214}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pp{50%{opacity:.35}}
.art{margin:-1.4rem -1.4rem 1.1rem;background:#050508;border-bottom:1px solid var(--line)}
#mbox .art{margin:-1.8rem -1.8rem 1.2rem}
.art svg{display:block;width:100%;height:auto}
.art .b{transform-box:fill-box;transform-origin:bottom;animation:gr 1s both}
.art .q{animation:pp 2.2s infinite}
.hh{display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.av{width:clamp(120px,22vw,170px);height:auto}
.av .rot{transform-origin:80px 80px;animation:sp 30s linear infinite}
.av .orb{transform-origin:80px 80px;animation:sp 9s linear infinite}
.rings{display:flex;gap:2rem;flex-wrap:wrap;margin-top:1rem}
.rg{text-align:center;font:600 .9rem var(--sans);color:var(--mute)}
.rg svg{width:110px;height:110px;display:block;margin:0 auto .4rem}
.rf{animation:dr 1.4s ease-out}
.flow{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fs{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.2rem}
.fs b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#000;font:800 1rem var(--sans);margin-bottom:.7rem}
.fs h4{font-size:1.1rem}.fs p{margin:.3rem 0 0;color:var(--mute);font-size:.95rem;line-height:1.5}
.fs:not(:last-child)::after{content:"\2192";position:absolute;right:-.85rem;top:1.3rem;color:var(--hi);font:800 1.2rem var(--sans);z-index:2}
@media(max-width:700px){.fs:not(:last-child)::after{content:"\2193";right:auto;left:1.4rem;top:auto;bottom:-1.15rem}}
.ic{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--hi));color:#000;font:800 .8rem var(--sans);font-style:normal;align-self:center}
.sk{align-items:center}
.certs li{display:flex;gap:.9rem;align-items:center}
.bd{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:10px;font:800 .8rem var(--sans);font-style:normal}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 function d(){x.clearRect(0,0,W,H);P.forEach(p=>{if(!rm){p.x+=p.vx;p.y+=p.vy}if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.fillStyle='rgba(124,155,255,.7)';x.fillRect(p.x,p.y,2,2)});
